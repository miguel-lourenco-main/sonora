# Submodule `infra` is not part of the parent tree; `include:local` cannot see those paths on GitLab.
# Pin `ref` to match: `git ls-tree HEAD infra` (update both when bumping the submodule).
include:
  - project: public-work4/infra
    ref: a58f1f908bbe680ae1538da71d62bc05d6555e92
    file:
      - ci/templates/base.gitlab-ci.yml
      - ci/templates/jobs-quality-single-package.gitlab-ci.yml
      - ci/templates/jobs-comment-mirror.gitlab-ci.yml
      - ci/templates/jobs-ai-ci-fix.gitlab-ci.yml
      - ci/templates/deploy-gitlab-pages.gitlab-ci.yml

variables:
  GIT_SUBMODULE_STRATEGY: recursive

# comment_mirror (from infra) documents code on the separate `comment-mirror/main` branch.
# Its default allowlist targets monorepos (apps/, packages/, tooling/, scripts/, infra/), so in
# this single-package repo only scripts/ was ever annotated. List this repo's source folders.
comment_mirror:
  variables:
    COMMENT_MIRROR_ALLOWED_PATH_PREFIXES: "app/,components/,lib/,config/,scripts/"
